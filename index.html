<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cupid's Calling</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f6c9cf}
  body.an-chuot,body.an-chuot *{cursor:none}
  /* Nen: KV phu kin man hinh */
  .nen{position:fixed;inset:0;background:url(kv.jpg) center/cover no-repeat}
  /* Slide: khung 16:9 lon nhat con vua cho — vi tri va kich thuoc do
     ham datBoCuc() tinh, tuy man hinh du rong de logo nam hai ben hay
     phai chua mot dai phia tren cho logo. */
  .sl{position:fixed;z-index:1;aspect-ratio:16/9;
      border-radius:min(1.2vmin,14px);overflow:hidden;background:#1a0618;
      box-shadow:0 0 0 2px rgba(255,255,255,.85),
                 0 0 0 9px rgba(255,255,255,.22),
                 0 28px 70px -10px rgba(140,10,50,.55),
                 0 0 120px rgba(255,180,200,.5)}
  .logo{position:fixed;z-index:1;height:auto;pointer-events:none;
      /* Quang sang trang om theo net chu: logo hong van doc ro tren canh
         hoa hong dam o hai ben KV */
      filter:drop-shadow(0 0 3px rgba(255,255,255,.95))
             drop-shadow(0 0 14px rgba(255,255,255,.75))
             drop-shadow(0 0 32px rgba(255,240,244,.6))}
  /* Khung nhung dung o kich thuoc CO DINH 1440 x (810 + 2 x 90) roi phong
     theo --s cho vua khung: Canva doi kieu dan trang khi khung qua rong
     (slide bi lech), nen khong de no thay kich thuoc that.
     Them 90px tren/duoi: Canva can slide vao giua, thanh dieu khien cua
     Canva nam o dai duoi va bi cat bo boi overflow:hidden. */
  .sl{--s:1}
  .sl iframe{border:0;display:block;position:absolute;left:0;
      top:calc(-90px * var(--s));width:1440px;height:990px;
      transform:scale(var(--s));transform-origin:0 0}
  /* Lop trong suot phu len khung: chan chuot vao Canva (thanh dieu khien
     cua Canva khong hien ra, nguoi xem khong lat ngoai thu tu), dong thoi
     bam trai/phai de lat. */
  .ph{position:absolute;inset:0;z-index:2}
  /* Nut toan man hinh — an cung con tro chuot khi dung yen */
  .nut{position:fixed;right:calc(3.5vmin + 14px);bottom:calc(3.5vmin + 14px);z-index:3;
      display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;
      font:600 14px/1 system-ui,"Segoe UI",sans-serif;color:#fff;cursor:pointer;
      background:rgba(214,58,104,.82);border:1px solid rgba(255,255,255,.55);
      box-shadow:0 6px 20px rgba(120,10,45,.35);backdrop-filter:blur(6px);
      transition:opacity .3s,background .2s}
  .nut:hover{background:rgba(232,72,120,.95)}
  .nut svg{width:16px;height:16px}
  body.an-chuot .nut{opacity:0;pointer-events:none}
</style></head>
<body>
<div class="nen"></div>
<img class="logo" id="lt" src="logo-newway.png" alt="Newway Realty">
<img class="logo" id="lp" src="logo-cupid.png" alt="Cupid's Calling">
<div class="sl">
  <iframe id="k" tabindex="-1"
          allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="ph" id="ph"></div>
</div>
<button class="nut" id="nut" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round"><path id="bt"
       d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <span id="cn">Toàn màn hình</span>
</button>

<script>
  // Phim: ← → (hoac PageUp/PageDown, cai bam slide) lat trang ·
  //       F hoac nut goc phai = toan man hinh (Esc de thoat) ·
  //       bam vao 1/3 trai cua slide = lui, con lai = tien.
  const GOC = "https://www.canva.com/design/DAGNoatK0Xw/zi32EsMemaXjzDXuyqK6IQ/view";
  // Thu tu lat: mac dinh bo trang 2-13 trong 69 trang. Doi nhanh qua dia chi:
  //   ?bo=2-13,20,25-27&tong=69
  const q = new URLSearchParams(location.search);
  const TONG = Math.min(999, Math.max(1, parseInt(q.get('tong'), 10) || 69));
  const BO = new Set();
  for (const p of (q.get('bo') || '2-13').split(',')) {
    const m = p.trim().match(/^(\d+)(?:-(\d+))?$/);
    if (!m) continue;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let n = Math.min(a, b); n <= Math.max(a, b); n++) BO.add(n);
  }
  const THU_TU = [];
  for (let n = 1; n <= TONG; n++) if (!BO.has(n)) THU_TU.push(n);
  let i = 0;
  const k = document.getElementById('k');
  k.src = GOC + '?embed#' + THU_TU[0];

  function di(n) {
    const moi = Math.max(0, Math.min(THU_TU.length - 1, n));
    if (moi === i) return;
    i = moi;
    const dich = GOC + '?embed#' + THU_TU[i];
    // Chi khac phan '#' nen trinh duyet nhay trong cung tai lieu, khong nap lai.
    try { k.contentWindow.location.href = dich; }
    catch (e) { k.src = dich; }
  }

  // Bo cuc: slide lon nhat co the + logo Newway goc trai, logo su kien goc
  // phai. Man rong: logo nam o khoang trong hai ben slide. Man gan 16:9:
  // chua mot dai phia tren cho logo, slide nam ngay ben duoi.
  const sl = document.querySelector('.sl');
  const lt = document.getElementById('lt'), lp = document.getElementById('lp');
  const TL_TRAI = 285 / 140, TL_PHAI = 1247 / 461;   // rong/cao cua logo
  function datBoCuc() {
    const W = innerWidth, H = innerHeight, m = Math.min(W, H) * 0.035;
    let rong = Math.min(W - 2 * m, (H - 2 * m) * 16 / 9);
    const hoc = (W - rong) / 2;                  // khoang trong moi ben
    let top, cao;                                // cao = chieu cao logo phai
    if (hoc - 2 * m >= H * 0.22) {               // du cho dat logo hai ben
      cao = Math.min((hoc - 2 * m) / TL_PHAI, H * 0.16);
      top = (H - rong * 9 / 16) / 2;
    } else {                                     // chua dai tren cho logo
      cao = Math.max(48, H * 0.1);
      top = cao + 1.6 * m;
      rong = Math.min(W - 2 * m, (H - top - m) * 16 / 9);
    }
    Object.assign(sl.style, { width: rong + 'px', left: (W - rong) / 2 + 'px',
                              top: top + 'px' });
    sl.style.setProperty('--s', rong / 1440);
    Object.assign(lp.style, { width: cao * TL_PHAI + 'px', top: m + 'px', right: m + 'px' });
    const caoTrai = cao * 0.95;
    Object.assign(lt.style, { width: caoTrai * TL_TRAI + 'px', top: m + 'px', left: m + 'px' });
  }
  addEventListener('resize', datBoCuc);
  datBoCuc();

  function toanManHinh() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  const nut = document.getElementById('nut');
  nut.addEventListener('click', () => { toanManHinh(); nut.blur(); });
  document.addEventListener('fullscreenchange', () => {
    const fs = !!document.fullscreenElement;
    document.body.classList.toggle('fs', fs);
    document.getElementById('cn').textContent = fs ? 'Thoát' : 'Toàn màn hình';
    document.getElementById('bt').setAttribute('d', fs
      ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5'
      : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
  });

  addEventListener('keydown', (e) => {
    const t = e.key;
    if (t === 'ArrowRight' || t === 'PageDown' || t === ' ') { e.preventDefault(); di(i + 1); }
    else if (t === 'ArrowLeft' || t === 'PageUp') { e.preventDefault(); di(i - 1); }
    else if (t === 'Home') di(0);
    else if (t === 'End') di(THU_TU.length - 1);
    else if (t === 'f' || t === 'F') toanManHinh();
  });

  document.getElementById('ph').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    di((e.clientX - r.left) < r.width / 3 ? i - 1 : i + 1);
  });

  // An con tro chuot va nut sau 2,5 giay dung yen
  let hen;
  function hienChuot() {
    document.body.classList.remove('an-chuot');
    clearTimeout(hen);
    hen = setTimeout(() => document.body.classList.add('an-chuot'), 2500);
  }
  addEventListener('mousemove', hienChuot);
  hienChuot();
</script>
</body></html>
