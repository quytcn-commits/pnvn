<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cupid's Calling</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#f6c9cf;
    font-family:system-ui,"Segoe UI",sans-serif}
  .nen{position:fixed;inset:0;background:url(kv.jpg) center/cover no-repeat}
  .hop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(420px,calc(100vw - 32px));padding:34px 30px 28px;border-radius:22px;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 30px 80px -20px rgba(140,10,50,.45);text-align:center}
  .hop img.su-kien{width:78%;display:block;margin:0 auto 6px}
  .hop img.cty{height:34px;display:block;margin:0 auto 18px}
  .hop p{margin:0 0 18px;color:#8a2a45;font-size:14px}
  input{width:100%;font:inherit;font-size:16px;padding:13px 16px;border-radius:12px;
    border:1px solid rgba(190,60,100,.35);background:rgba(255,255,255,.9);color:#4a1022;
    outline:none}
  input:focus{border-color:#d63a68;box-shadow:0 0 0 3px rgba(214,58,104,.18)}
  button{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:16px;
    padding:13px;border:0;border-radius:12px;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#e2507e,#c92f5e)}
  button:disabled{opacity:.6;cursor:wait}
  .loi{min-height:20px;margin-top:10px;font-size:13px;color:#c0204e}
</style></head>

<div class="nen"></div>

  <div class="loi" id="loi"></div>
</form>

  const tu64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function moKhoa(mk) {
    const vl = await crypto.subtle.importKey('raw', new TextEncoder().encode(mk),
      'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: tu64(MUOI), iterations: VONG, hash: 'SHA-256' },
      vl, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const ro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: tu64(IV) }, k, tu64(MA));
    return new TextDecoder().decode(ro);
  }

  function hien(html) { document.open(); document.write(html); document.close(); }

  // Nho mat khau trong tab nay (tai lai trang khong phai nhap lai);
  // dong tab la mat.
  let daLuu = null;
  try { daLuu = sessionStorage.getItem('qtpn'); } catch (e) {}
  if (daLuu) moKhoa(daLuu).then(hien).catch(() => {
    try { sessionStorage.removeItem('qtpn'); } catch (e) {}
  });

  const f = document.getElementById('f'), nut = document.getElementById('nut'),

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    nut.disabled = true; nut.textContent = 'Đang mở…'; loi.textContent = '';
    try {
      const html = await moKhoa(o.value);
      try { sessionStorage.setItem('qtpn', o.value); } catch (e) {}

    } catch (err) {

      nut.disabled = false; nut.textContent = 'Vào xem'; o.select();
